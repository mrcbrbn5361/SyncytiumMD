name: Bug report
description: Something is broken in SyncytiumMD
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: syncytium-md version
      description: Output of `syncytium --version`
      placeholder: 0.2.2
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v20.x
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal commands starting from an empty dir
      placeholder: |
        npx syncytium-md init demo --template generic
        npx syncytium-md sync
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste `syncytium doctor` and `syncytium diff` output if relevant
