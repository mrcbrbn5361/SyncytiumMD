name: SyncytiumMD Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syncytium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Zero-Context-Drift Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Syncytium
        run: npm install -g syncytium-md

      - name: Validate canonical rules
        run: syncytium lint

      - name: Validate configuration schema
        run: syncytium validate

      # --check makes drift a non-zero exit code, so this gate can actually fail.
      - name: Verify zero context drift
        run: syncytium diff --check

  self-test:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build must come first: the test suite imports ../dist/index.js, so
      # `tsc --noEmit` over tests/ needs the emitted type declarations to exist.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
